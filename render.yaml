# Opcional: permite criar o serviço no Render com "New + > Blueprint".
# Se preferir o caminho manual (descrito no README), ignore este arquivo.
services:
  - type: web
    name: quebra-cabeca-a-dois
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # Contas, amigos e progresso salvo (veja CONTAS.md). Sem DATABASE_URL o jogo funciona como visitante.
      - key: DATABASE_URL
        sync: false          # você cola o endereço do banco no painel do Render (nunca no GitHub)
      - key: GOOGLE_CLIENT_ID
        sync: false          # opcional: ativa o botão "Continuar com o Google"
      - key: BREVO_API_KEY
        sync: false          # opcional: chave do Brevo para enviar o código de confirmação de e-mail (veja SEGURANCA.md)
      - key: MAIL_FROM
        sync: false          # o e-mail remetente já confirmado no Brevo
    envVars:
      # Contas e amigos (opcional). Veja o CONTAS.md. Os valores são preenchidos no painel do Render (nunca aqui).
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
